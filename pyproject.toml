[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coda"
version = "0.3.0"
description = "Small local coding agent for OpenAI-compatible, Anthropic-compatible, and DeepSeek models"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0.0",
  "textual>=0.86.0",
  "tomli>=2.0.0; python_version < '3.11'",
  "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
providers = [
  "anthropic==0.117.0",
  "httpx[socks]>=0.25,<1",
  "openai==2.46.0",
]

[project.scripts]
coda = "coda.cli:main"
coda-tui = "coda.tui.main:main"

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.4.4",
]

[tool.setuptools.packages.find]
include = ["coda*"]

[tool.pytest.ini_options]
norecursedirs = [
  ".git",
  ".venv",
  "artifacts",
  "build",
  "dist",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
