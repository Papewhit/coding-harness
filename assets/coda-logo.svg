<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Coda logo</title>
  <desc id="description">A serif-inspired musical coda mark with tapered horizontal and vertical strokes.</desc>

  <defs>
    <linearGradient
      id="mark-gradient"
      gradientUnits="userSpaceOnUse"
      x1="96"
      y1="80"
      x2="416"
      y2="432"
    >
      <stop offset="0" stop-color="#f7faff" />
      <stop offset="0.42" stop-color="#d7e6ff" />
      <stop offset="0.72" stop-color="#b6d1ff" />
      <stop offset="1" stop-color="#8db8ff" />
    </linearGradient>
    <filter id="mark-depth" x="-12%" y="-12%" width="124%" height="128%">
      <feDropShadow
        dx="0"
        dy="3"
        stdDeviation="3"
        flood-color="#050a13"
        flood-opacity="0.48"
      />
    </filter>
  </defs>

  <rect
    x="32"
    y="32"
    width="448"
    height="448"
    rx="88"
    fill="#0f1117"
    stroke="#273244"
    stroke-width="3"
  />

  <g fill="url(#mark-gradient)" filter="url(#mark-depth)">
    <path d="
      M 64 256
      C 122 253, 190 247, 256 246
      C 322 247, 390 253, 448 256
      C 390 259, 322 265, 256 266
      C 190 265, 122 259, 64 256
      Z
    " />
    <path d="
      M 256 64
      C 253 122, 247 190, 246 256
      C 247 322, 253 390, 256 448
      C 259 390, 265 322, 266 256
      C 265 190, 259 122, 256 64
      Z
    " />
    <path
      fill-rule="evenodd"
      d="
        M 256 130
        a 126 126 0 1 0 0 252
        a 126 126 0 1 0 0 -252
        Z
        M 256 146
        a 92 110 0 1 1 0 220
        a 92 110 0 1 1 0 -220
        Z
      "
    />
  </g>
</svg>
